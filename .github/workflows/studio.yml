# Builds RHIS Studio, the Windows client (apps/studio), and publishes it as a GitHub release:
#   main -> studio-v<version>         (production channel)
#   test -> studio-v<version>-test.N  (test channel, a pre-release)
# Pull requests only build and test. The server's /api/studio/releases and the client's update check read these releases.
name: Studio client

on:
  push:
    branches: [main, test]
    paths: ['apps/studio/**', '.github/workflows/studio.yml']
  pull_request:
    paths: ['apps/studio/**', '.github/workflows/studio.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri

      - name: Install packages
        run: pnpm install --frozen-lockfile --filter @hrs/studio

      - name: Version
        id: version
        run: |
          base=$(node -p "require('./apps/studio/package.json').version")
          if [ "$GITHUB_REF" = "refs/heads/test" ]; then version="$base-test.$GITHUB_RUN_NUMBER"; else version="$base"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The installer, the app's own version and the update check all use this one number.
          node -e "const f='apps/studio/package.json',p=require('./'+f);p.version='$version';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          sed -i "0,/^version = \".*\"/s//version = \"$version\"/" apps/studio/src-tauri/Cargo.toml
          echo "Building RHIS Studio $version"

      - name: Unit tests (audio engine, encoder, streamer)
        working-directory: apps/studio/src-tauri
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo test --features asio

      - name: Build the installer
        working-directory: apps/studio
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: pnpm tauri build --features asio

      - name: Collect
        id: collect
        run: |
          mkdir -p out
          cp apps/studio/src-tauri/target/release/bundle/nsis/*-setup.exe out/
          cd out
          # GitHub turns spaces in asset names into dots; do it here so the checksum file matches the asset.
          for f in *-setup.exe; do mv "$f" "${f// /.}"; done
          sha256sum *-setup.exe | sed 's/ \*/  /' > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "installer=$(ls *-setup.exe)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: rhis-studio-${{ steps.version.outputs.version }}
          path: out/*

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="studio-v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; raise the version in apps/studio/package.json to publish a new production build."
            exit 0
          fi
          if [ "$GITHUB_REF" = "refs/heads/test" ]; then
            flags="--prerelease"
            notes="Test build of RHIS Studio from the test branch ($GITHUB_SHA)."
          else
            flags=""
            notes="RHIS Studio $VERSION for Windows. Download the installer below, or update from the Info dialog in the app."
          fi
          gh release create "$tag" out/* --target "$GITHUB_SHA" --title "RHIS Studio $VERSION" --notes "$notes" $flags
