<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700"><rect width="1200" height="700" rx="18" fill="#F6F7FB"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FF6B57"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B8DEF"/></marker></defs><rect x="380" y="28" width="440" height="92" rx="12" fill="#14213D" stroke="#FF6B57" stroke-width="1.5"/><text x="396" y="54" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Orchestrator (main server)</text><text x="396" y="75" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#C9D3E6">Admin panel, API, database, statistics, updates</text><text x="396" y="93" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#C9D3E6">Steers nodes and probes, checks encoder log-ins. Carries no audio.</text><rect x="24" y="176" width="250" height="470" rx="14" fill="#EEF1F7"/><text x="38" y="198" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#4F5B73">STUDIOS &amp; ENCODERS</text><rect x="300" y="176" width="270" height="470" rx="14" fill="#EEF1F7"/><text x="314" y="198" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#4F5B73">INGEST</text><rect x="596" y="176" width="290" height="470" rx="14" fill="#EEF1F7"/><text x="610" y="198" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#4F5B73">DISTRIBUTION</text><rect x="912" y="176" width="264" height="470" rx="14" fill="#EEF1F7"/><text x="926" y="198" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#4F5B73">AUDIENCE</text><rect x="40" y="220" width="218" height="78" rx="12" fill="#FFFFFF" stroke="#DCE1EB" stroke-width="1"/><text x="56" y="246" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14213D">Live studio</text><text x="56" y="267" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">RHIS Studio, mixing desk,</text><text x="56" y="285" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">BUTT, any Icecast encoder</text><rect x="40" y="330" width="218" height="78" rx="12" fill="#FFFFFF" stroke="#DCE1EB" stroke-width="1"/><text x="56" y="356" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14213D">Remote DJ</text><text x="56" y="377" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">Encoder at home, HTTPS (8443)</text><text x="56" y="395" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">or plain (8010)</text><rect x="40" y="530" width="218" height="78" rx="12" fill="#FFFFFF" stroke="#DCE1EB" stroke-width="1"/><text x="56" y="556" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14213D">Studio with own node</text><text x="56" y="577" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">Music library and AutoDJ</text><text x="56" y="595" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">stay in the building</text><rect x="316" y="250" width="238" height="96" rx="12" fill="#FFFFFF" stroke="#DCE1EB" stroke-width="1"/><text x="332" y="276" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14213D">Ingest node</text><text x="332" y="297" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">Takes encoders on src.&lt;domain&gt;</text><text x="332" y="315" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">Transcodes with ffmpeg</text><text x="332" y="333" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">Backup ingest possible</text><rect x="493.4" y="262" width="48.599999999999994" height="20" rx="10" fill="#E8F0FF"/><text x="517.7" y="276" text-anchor="middle" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#14213D">source</text><rect x="316" y="376" width="238" height="78" rx="12" fill="#FFFFFF" stroke="#DCE1EB" stroke-width="1"/><text x="332" y="402" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14213D">This server · ingest</text><text x="332" y="423" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">Single-server setup and</text><text x="332" y="441" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">AutoDJ stations</text><rect x="500.0" y="388" width="42.0" height="20" rx="10" fill="#E8F0FF"/><text x="521.0" y="402" text-anchor="middle" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#14213D">local</text><rect x="316" y="520" width="238" height="96" rx="12" fill="#FFFFFF" stroke="#DCE1EB" stroke-width="1"/><text x="332" y="546" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14213D">Station node</text><text x="332" y="567" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">Library, AutoDJ, hour clocks</text><text x="332" y="585" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">and live assist on site</text><text x="332" y="603" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">Pushes to relays</text><rect x="486.8" y="532" width="55.199999999999996" height="20" rx="10" fill="#E8F0FF"/><text x="514.4" y="546" text-anchor="middle" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#14213D">station</text><rect x="612" y="214" width="258" height="78" rx="12" fill="#FFFFFF" stroke="#DCE1EB" stroke-width="1"/><text x="628" y="240" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14213D">Relay · Amsterdam</text><text x="628" y="261" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">Serves listeners over HTTPS</text><text x="628" y="279" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">Push port 8001 (TLS)</text><rect x="816.0" y="226" width="42.0" height="20" rx="10" fill="#E8F0FF"/><text x="837.0" y="240" text-anchor="middle" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#14213D">relay</text><rect x="612" y="318" width="258" height="78" rx="12" fill="#FFFFFF" stroke="#DCE1EB" stroke-width="1"/><text x="628" y="344" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14213D">Relay · Frankfurt</text><text x="628" y="365" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">Main and backup feed,</text><text x="628" y="383" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">switches without a gap</text><rect x="816.0" y="330" width="42.0" height="20" rx="10" fill="#E8F0FF"/><text x="837.0" y="344" text-anchor="middle" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#14213D">relay</text><rect x="612" y="422" width="258" height="62" rx="12" fill="#FFFFFF" stroke="#DCE1EB" stroke-width="1"/><text x="628" y="448" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14213D">This server · relay</text><text x="628" y="469" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">Single-server setup</text><rect x="816.0" y="434" width="42.0" height="20" rx="10" fill="#E8F0FF"/><text x="837.0" y="448" text-anchor="middle" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#14213D">local</text><rect x="612" y="520" width="258" height="96" rx="12" fill="#FFFFFF" stroke="#DCE1EB" stroke-width="1"/><text x="628" y="546" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14213D">FM/MPX node</text><text x="628" y="567" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">Stereo encoder + RDS</text><text x="628" y="585" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">192 kHz sound card or MPX/IP</text><text x="628" y="603" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">or UECP to an RDS encoder</text><rect x="835.8" y="532" width="22.2" height="20" rx="10" fill="#E8F0FF"/><text x="846.9" y="546" text-anchor="middle" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#14213D">fm</text><rect x="928" y="250" width="232" height="96" rx="12" fill="#FFFFFF" stroke="#DCE1EB" stroke-width="1"/><text x="944" y="276" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14213D">Listeners</text><text x="944" y="297" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">Web player, apps, smart speakers</text><text x="944" y="315" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">Sent to the nearest healthy relay</text><text x="944" y="333" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">(GeoIP, load, country)</text><rect x="928" y="520" width="232" height="78" rx="12" fill="#FFFFFF" stroke="#DCE1EB" stroke-width="1"/><text x="944" y="546" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14213D">FM radios</text><text x="944" y="567" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">Song titles on the display</text><text x="944" y="585" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F5B73">via RDS RadioText+</text><path d="M258 259 C290 259 290 290 316 290" fill="none" stroke="#FF6B57" stroke-width="2.5" marker-end="url(#a)"/><path d="M258 369 C290 369 290 300 316 300" fill="none" stroke="#FF6B57" stroke-width="2.5" marker-end="url(#a)"/><path d="M258 569 C290 569 290 568 316 568" fill="none" stroke="#FF6B57" stroke-width="2.5" marker-end="url(#a)"/><path d="M554 280 C585 280 585 253 612 253" fill="none" stroke="#FF6B57" stroke-width="2.5" marker-end="url(#a)"/><rect x="546.5" y="216" width="73.0" height="20" rx="10" fill="#F6F7FB" stroke="#DCE1EB"/><text x="583" y="230" text-anchor="middle" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#4F5B73">push · TLS</text><path d="M554 300 C590 300 585 357 612 357" fill="none" stroke="#FF6B57" stroke-width="2.5" marker-end="url(#a)"/><path d="M554 560 C590 560 580 270 612 270" fill="none" stroke="#FF6B57" stroke-width="2.5" marker-end="url(#a)"/><path d="M554 580 C590 580 585 380 612 380" fill="none" stroke="#FF6B57" stroke-width="2.5" marker-end="url(#a)"/><path d="M554 415 C585 415 585 453 612 453" fill="none" stroke="#FF6B57" stroke-width="2.5" marker-end="url(#a)"/><path d="M870 253 C900 253 900 290 928 290" fill="none" stroke="#FF6B57" stroke-width="2.5" marker-end="url(#a)"/><rect x="878.25" y="252" width="41.5" height="20" rx="10" fill="#F6F7FB" stroke="#DCE1EB"/><text x="899" y="266" text-anchor="middle" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#4F5B73">HTTPS</text><path d="M870 357 C900 357 900 310 928 310" fill="none" stroke="#FF6B57" stroke-width="2.5" marker-end="url(#a)"/><path d="M870 453 C905 453 905 330 928 330" fill="none" stroke="#FF6B57" stroke-width="2.5" marker-end="url(#a)"/><path d="M741 484 L741 520" fill="none" stroke="#FF6B57" stroke-width="2.5" marker-end="url(#a)"/><path d="M870 568 C900 568 900 559 928 559" fill="none" stroke="#FF6B57" stroke-width="2.5" marker-end="url(#a)"/><rect x="884.55" y="542" width="28.9" height="20" rx="10" fill="#F6F7FB" stroke="#DCE1EB"/><text x="899" y="556" text-anchor="middle" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#4F5B73">MPX</text><path d="M600 120 C600 150 435 146 435 176" fill="none" stroke="#5B8DEF" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#c)" marker-start="url(#c)"/><path d="M600 120 C600 150 741 146 741 176" fill="none" stroke="#5B8DEF" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#c)" marker-start="url(#c)"/><rect x="428.05" y="136" width="343.9" height="20" rx="10" fill="#F6F7FB" stroke="#5B8DEF"/><text x="600" y="150" text-anchor="middle" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#4F5B73">WSS /api/nodes/connect to every node · ping every 5 s</text><path d="M40 676h34" stroke="#FF6B57" stroke-width="2.5" marker-end="url(#a)"/><text x="84" y="680" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4F5B73">Audio</text><path d="M150 676h34" stroke="#5B8DEF" stroke-width="1.6" stroke-dasharray="5 5"/><text x="194" y="680" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4F5B73">Control channel (no audio)</text><text x="1160" y="680" text-anchor="end" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4F5B73">Every node is also a remote probe that checks its streams.</text></svg>