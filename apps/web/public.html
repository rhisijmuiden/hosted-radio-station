<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="preload" href="/brand/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Radio</title>
    <script>
      // Theme before first paint: ?theme=, then the listener's own choice, else the system (the station may override later).
      try {
        var q = new URLSearchParams(location.search).get('theme');
        var t = q === 'light' || q === 'dark' ? q : localStorage.getItem('hrs-public-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/public/main.tsx"></script>
  </body>
</html>
