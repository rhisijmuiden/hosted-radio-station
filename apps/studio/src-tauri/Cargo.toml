[package]
name = "rhis-studio"
version = "0.34.0"
description = "RHIS Studio: the Windows client of Hosted Radio Station"
authors = ["RHIS"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/rhisijmuiden/hosted-radio-station"
edition = "2021"
rust-version = "1.80"

[lib]
name = "rhis_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Steinberg ASIO for professional sound cards (needs the ASIO SDK at build time, see README).
asio = ["cpal/asio"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
cpal = "0.16"
mp3lame-encoder = "0.2"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "pcm", "ogg", "vorbis", "aac", "isomp4"] }
native-tls = "0.2"
base64 = "0.22"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json", "multipart"] }
sha2 = "0.10"
hex = "0.4"
gethostname = "1"
log = "0.4"
ringbuf = "0.4"
rubato = "0.16"
# The tablet panel: a small web server on the studio network (see src/panel.rs).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "json", "query"] }
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt"] }
getrandom = "0.2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# https for the tablet panel: a Let's Encrypt certificate per studio PC (DNS-01 through the main server).
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "ring", "rcgen"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
rcgen = "0.14"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
